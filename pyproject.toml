# pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genie-tts"
version = "2.0.2"
authors = [
    { name = "High_Logic", email = "highlogic233@gmail.com" },
]
description = "GPT-SoVITS ONNX Inference Engine & Model Converter"
# readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "onnx", # ONNX 模型格式支持
    "onnxruntime==1.22.1", # ONNX 推理引擎, 指定版本号以避免 1.23 的性能倒退
    "tokenizers", # HuggingFace tokenizer
    "numpy", # 数值计算
    "soundfile", # 音频读写
    "soxr", # 高质量重采样
    "pyyaml", # YAML 解析
    "sounddevice", # 音频播放
    "pydantic", # 配置 / 数据模型
    "huggingface_hub[hf_xet]", # HF Hub 支持 + xet
    "fastapi", # Web API 框架
    "uvicorn[standard]", # ASGI 服务器
    # 日文 G2P
    "pyopenjtalk-plus", # 日语 G2P
    # 英文 G2P
    "nltk", # 英语 NLP 工具
    # 中文 G2P
    "pypinyin", # 中文拼音
    "g2pM", # 中文 G2P 模型
    "jieba_fast", # 中文分词
    "jamo",
    "ko_pron",
    "g2pk2",
    "eunjeon"
]

[project.optional-dependencies]
gui = ["PySide6"]
dev = ["pytest"]


[project.urls]
Homepage = "https://github.com/High-Logic/Genie"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "E402",  # 导入顺序依赖导入期副作用（sys.path 修正等）
    "E501",  # 暂不强制约束行长
    "E701",  # 移植代码中的单行多语句写法
    "E721",  # 存量类型比较写法
    "F401",  # 有意保留的未使用导入
    "F541",  # 无占位符的 f-string
    "W291",  # 空白问题
    "W292",  # 同上
    "W293",  # 同上
    "B007",  # 未使用的循环变量需逐一确认
    "B008",  # 默认参数中的函数调用需逐一确认
    "B904",  # 异常衔接（from/from None）需逐一确认
    "B905",  # zip 改 strict 可能改变行为
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"genie_tts" = [
    "Data/v2/Models/*",
    "Data/v2/Keys/*",
    "Data/v2ProPlus/Models/*",
    "Data/v2ProPlus/Keys/*",
]
